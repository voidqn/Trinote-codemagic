workflows:
  ios-unsigned-ipa:
    name: Trinote Unsigned iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        # Optional: define CUSTOM_APP_GROUP_ID in this Codemagic UI group
        # (e.g. group.xxxxxxxx.1 from your signing certificate's .mobileprovision)
        # so Share Sheet App Group handoff matches your signing profile.
        - trinote_signing
      vars:
        XCODE_SCHEME: "Trinote"
        XCODE_CONFIGURATION: "Release"
        EMBED_ADHOC_ENTITLEMENTS: "true"
    cache:
      cache_paths:
        - $HOME/Library/Caches/TrinoteSPM
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: codemagic
          include: true
          source: true
      tag_patterns:
        - pattern: "*"
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Build unsigned iOS IPA
        script: |
          chmod +x .codemagic/build-unsigned-ipa.sh
          ./.codemagic/build-unsigned-ipa.sh
    artifacts:
      - build/codemagic/ipa/*.ipa
